<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KetemuTerus — QC Kartu</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;background:#f8fafc;color:#0f172a}
main{max-width:460px;margin:auto;padding:42px 20px}.brand{font-size:22px;font-weight:800;margin-bottom:32px}.blue{color:#2563eb}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:26px;box-shadow:0 12px 40px rgba(15,23,42,.07)}
h1{font-size:27px;margin:0 0 10px}.sub{font-size:14px;line-height:1.6;color:#64748b}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#2563eb;color:#fff;font-weight:700;font-size:14px}
button.off{background:#e2e8f0;color:#0f172a}.status{margin-top:18px;padding:12px;border-radius:10px;background:#eff6ff;color:#2563eb;font-size:13px;font-weight:700;text-align:center}
.note{margin-top:18px;color:#94a3b8;font-size:12px;line-height:1.5}
</style></head>
<body><main>
<div class="brand">Ketemu<span class="blue">Terus</span> <small style="font-size:11px;color:#94a3b8">QC</small></div>
<div class="box">
<h1>QC Kartu Produksi</h1>
<p class="sub">Aktifkan mode QC, lalu scan QR kartu. Sistem akan menampilkan Card ID tanpa mengarahkan ke Google Review.</p>
<div class="status">● QC MODE SIAP</div>
<button id="on">Aktifkan QC Mode</button>
<button class="off" id="off">Matikan QC Mode</button>
<p class="note">Setelah QC selesai, matikan mode QC agar QR kembali bekerja normal untuk pelanggan.</p>
</div></main>
<script>
document.getElementById('on').onclick=()=>{localStorage.setItem('kt_qc_mode','1');location.href='/r/KT000001?src=qr'};
document.getElementById('off').onclick=()=>{localStorage.removeItem('kt_qc_mode');alert('QC Mode dimatikan.');};
</script></body></html>
