<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KetemuTerus — QC Mode</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;background:#f8fafc;color:#0f172a}
main{max-width:460px;margin:0 auto;padding:40px 20px;text-align:center}
.brand{font-size:22px;font-weight:800;margin-bottom:36px}.blue{color:#2563eb}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(15,23,42,.07)}
h1{font-size:26px;margin:0 0 10px}.sub{font-size:14px;line-height:1.6;color:#64748b}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;background:#2563eb;color:#fff;font-weight:700;font-size:14px}
button.off{background:#e2e8f0;color:#0f172a}
.status{margin-top:18px;font-size:13px;color:#16a34a;font-weight:700}
</style>
</head>
<body>
<main>
<div class="brand">Ketemu<span class="blue">Terus</span> <small style="font-size:11px;color:#94a3b8">QC</small></div>
<div class="box">
<h1>QC Kartu Produksi</h1>
<p class="sub">Aktifkan mode QC, lalu gunakan kamera HP untuk scan QR pada kartu. QR tidak perlu diubah atau dicetak ulang.</p>
<div class="status">● MODE QC AKTIF</div>
<button onclick="location.href='/r/KT000001?src=qr'">Tes KT000001</button>
<button class="off" onclick="localStorage.removeItem('kt_qc_mode');location.reload()">Matikan Mode QC</button>
</div>
</main>
<script>localStorage.setItem('kt_qc_mode','1');</script>
</body>
</html>
