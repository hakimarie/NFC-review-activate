<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KetemuTerus — Client Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#eff6ff;color:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:#fff;padding:36px;border-radius:20px;box-shadow:0 12px 40px rgba(15,23,42,.10)}
.logo{font-size:28px;font-weight:700;letter-spacing:-.5px}.logo span{color:#2563eb}
.badge{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:12px;font-weight:700}
.subtitle{margin:18px 0 26px;color:#64748b;font-size:15px;line-height:1.5}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 7px}
input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#1d4ed8}
button:disabled{opacity:.7;cursor:wait}
.error{color:#dc2626;margin-top:14px;font-size:14px;line-height:1.4;min-height:20px}
.footer{text-align:center;margin-top:24px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Ketemu<span>Terus</span></div>
  <div class="badge">CLIENT DASHBOARD</div>
  <div class="subtitle">Masuk untuk melihat performa kartu QR & NFC dan aktivitas Google Review bisnis Anda.</div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="Email Anda">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button id="login">Masuk ke Dashboard</button>
  <div id="error" class="error"></div>
  <div class="footer">KetemuTerus · Lebih Mudah Ditemukan. Lebih Banyak Pelanggan.</div>
</div>
<script>
const SUPABASE_URL='https://bjoinxzfddwpjkijjbyr.supabase.co';
const SUPABASE_KEY='sb_publishable_O47NBwd2a7Px7CE1SSU0Mw_I78zGoMj';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function redirectIfLoggedIn(){
  const {data}=await supabase.auth.getSession();
  if(data.session) window.location.replace('/client/dashboard.html');
}

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const errorBox=document.getElementById('error');
  const button=document.getElementById('login');
  errorBox.textContent='';
  if(!email||!password){errorBox.textContent='Email dan password wajib diisi.';return;}
  button.disabled=true;
  button.textContent='Memeriksa...';
  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error){
    errorBox.textContent='Email atau password tidak sesuai.';
    button.disabled=false;
    button.textContent='Masuk ke Dashboard';
    return;
  }
  window.location.replace('/client/dashboard.html');
}

document.getElementById('login').addEventListener('click',login);
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
redirectIfLoggedIn();
</script>
</body>
</html>
