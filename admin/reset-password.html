<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - KetemuTerus</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  padding:30px;
}

.card{
  max-width:400px;
  margin:100px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  margin-top:0;
}

label{
  display:block;
  margin-top:16px;
  font-weight:600;
}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:20px;
  padding:12px;
  background:#222;
  color:#fff;
  border:0;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.message{
  margin-top:15px;
  text-align:center;
}

.success{
  color:#198754;
}

.error{
  color:#dc3545;
}
</style>
</head>

<body>

<div class="card">

<h1>Reset Password</h1>

<label>Password Baru</label>
<input
  id="password"
  type="password"
  placeholder="Minimal 6 karakter"
  autocomplete="new-password"
>

<label>Ulangi Password</label>
<input
  id="password2"
  type="password"
  placeholder="Ulangi password"
  autocomplete="new-password"
>

<button id="reset">Simpan Password Baru</button>

<p id="message" class="message"></p>

</div>

<script>

const SUPABASE_URL='https://bjoinxzfddwpjkijjbyr.supabase.co';

const SUPABASE_KEY='sb_publishable_O47NBwd2a7Px7CE1SSU0Mw_I78zGoMj';

const supabase=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById('reset').addEventListener('click',async()=>{

  const password=document.getElementById('password').value;
  const password2=document.getElementById('password2').value;

  const message=document.getElementById('message');

  message.textContent='';
  message.className='message';

  if(password.length < 6){
    message.textContent='Password minimal 6 karakter.';
    message.classList.add('error');
    return;
  }

  if(password !== password2){
    message.textContent='Password tidak sama.';
    message.classList.add('error');
    return;
  }

  const { error } = await supabase.auth.updateUser({
    password: password
  });

  if(error){
    message.textContent=error.message;
    message.classList.add('error');
    return;
  }

  message.textContent='Password berhasil diubah. Mengarahkan ke halaman login...';
  message.classList.add('success');

  setTimeout(()=>{
    window.location.href='/admin/';
  },1500);

});

</script>

</body>
</html>
