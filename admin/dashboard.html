<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KetemuTerus Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:700;
}

.logo span{
  color:#2563eb;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  font-size:14px;
}

.logout{
  background:#111827;
  color:#fff;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

h1{
  margin-bottom:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.stat-label{
  color:#6b7280;
  font-size:14px;
}

.stat-value{
  font-size:28px;
  font-weight:700;
  margin-top:8px;
}

.panel{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.panel h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:12px;
  align-items:end;
}

label{
  display:block;
  font-weight:600;
  font-size:13px;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:14px;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.message{
  margin-top:12px;
  font-size:14px;
}

.success{
  color:#198754;
}

.error{
  color:#dc3545;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:13px;
}

th{
  background:#f9fafb;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

.available{
  background:#dcfce7;
  color:#166534;
}

.active{
  background:#dbeafe;
  color:#1d4ed8;
}

.suspended{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  color:#6b7280;
  text-align:center;
  padding:30px;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  header{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Ketemu<span>Terus</span> Admin
  </div>

  <button class="logout" id="logout">
    Logout
  </button>
</header>

<div class="container">

<h1>Dashboard</h1>

<div class="stats">

  <div class="stat">
    <div class="stat-label">Total Kartu</div>
    <div class="stat-value" id="total">-</div>
  </div>

  <div class="stat">
    <div class="stat-label">Available</div>
    <div class="stat-value" id="available">-</div>
  </div>

  <div class="stat">
    <div class="stat-label">Active</div>
    <div class="stat-value" id="active">-</div>
  </div>

  <div class="stat">
    <div class="stat-label">Suspended</div>
    <div class="stat-value" id="suspended">-</div>
  </div>

</div>


<div class="panel">

<h2>Generate Kartu</h2>

<div class="form-grid">

  <div>
    <label>Jumlah</label>
    <input id="quantity" type="number" value="50" min="1">
  </div>

  <div>
    <label>Prefix</label>
    <input id="prefix" type="text" value="KT">
  </div>

  <button class="primary" id="generate">
    Generate
  </button>

</div>

<p id="generateMessage" class="message"></p>

</div>


<div class="panel">

<h2>Aktivasi Kartu</h2>

<div class="form-grid">

  <div>
    <label>Card Code</label>
    <input id="cardCode" placeholder="KT000001">
  </div>

  <div>
    <label>Nama Bisnis</label>
    <input id="businessName" placeholder="Nama bisnis">
  </div>

  <div>
    <button class="primary" id="activate">
      Aktivasi
    </button>
  </div>

</div>

<div style="margin-top:12px">

  <label>Google Place ID</label>
  <input id="placeId" placeholder="ChIJ...">

</div>

<div style="margin-top:12px">

  <label>PIN 4 Digit</label>
  <input id="pin" type="password" maxlength="4" placeholder="1234">

</div>

<p id="activateMessage" class="message"></p>

</div>


<div class="panel">

<h2>Inventory Kartu</h2>

<div class="table-wrap">

<table>

<thead>

<tr>
  <th>Card Code</th>
  <th>Status</th>
  <th>Business</th>
  <th>Place ID</th>
  <th>Review URL</th>
  <th>Activated</th>
</tr>

</thead>

<tbody id="inventory">

<tr>
  <td colspan="6" class="empty">
    Memuat inventory...
  </td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

const SUPABASE_URL='https://bjoinxzfddwpjkijjbyr.supabase.co';

const SUPABASE_KEY='sb_publishable_O47NBwd2a7Px7CE1SSU0Mw_I78zGoMj';

const supabase=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* AUTH */

async function checkAuth(){

  const {data,error}=await supabase.auth.getSession();

  if(error || !data.session){

    window.location.href='/admin/';
    return false;

  }

  return true;
}


/* LOAD INVENTORY */

async function loadInventory(){

  const {data,error}=await supabase.rpc('list_cards');

  const inventory=document.getElementById('inventory');

  if(error){

    inventory.innerHTML=`
      <tr>
        <td colspan="6" class="empty">
          Gagal memuat inventory: ${escapeHtml(error.message)}
        </td>
      </tr>
    `;

    return;

  }

  const cards=data || [];

  let available=0;
  let active=0;
  let suspended=0;

  cards.forEach(card=>{

    if(card.status==='AVAILABLE') available++;
    if(card.status==='ACTIVE') active++;
    if(card.status==='SUSPENDED') suspended++;

  });

  document.getElementById('total').textContent=cards.length;
  document.getElementById('available').textContent=available;
  document.getElementById('active').textContent=active;
  document.getElementById('suspended').textContent=suspended;

  if(cards.length===0){

    inventory.innerHTML=`
      <tr>
        <td colspan="6" class="empty">
          Belum ada kartu.
        </td>
      </tr>
    `;

    return;

  }

  inventory.innerHTML=cards.map(card=>{

    const statusClass=
      card.status==='ACTIVE'
      ? 'active'
      : card.status==='SUSPENDED'
      ? 'suspended'
      : 'available';

    const activated=card.activated_at
      ? new Date(card.activated_at).toLocaleString('id-ID')
      : '-';

    return `

      <tr>

        <td><strong>${escapeHtml(card.card_code)}</strong></td>

        <td>
          <span class="badge ${statusClass}">
            ${escapeHtml(card.status)}
          </span>
        </td>

        <td>
          ${escapeHtml(card.business_name || '-')}
        </td>

        <td>
          ${escapeHtml(card.place_id || '-')}
        </td>

        <td>
          ${
            card.review_url
            ? `<a href="${escapeHtml(card.review_url)}"
                 target="_blank"
                 rel="noopener">
                 Review
               </a>`
            : '-'
          }
        </td>

        <td>
          ${activated}
        </td>

      </tr>

    `;

  }).join('');

}


/* GENERATE */

document.getElementById('generate')
.addEventListener('click',async()=>{

  const quantity=parseInt(
    document.getElementById('quantity').value,
    10
  );

  const prefix=document.getElementById('prefix').value.trim();

  const message=document.getElementById('generateMessage');

  message.textContent='';
  message.className='message';

  if(!quantity || quantity<1){

    message.textContent='Jumlah kartu tidak valid.';
    message.classList.add('error');
    return;

  }

  if(!prefix){

    message.textContent='Prefix wajib diisi.';
    message.classList.add('error');
    return;

  }

  const {data,error}=await supabase.rpc(
    'generate_cards',
    {
      p_quantity:quantity,
      p_prefix:prefix
    }
  );

  if(error){

    message.textContent=error.message;
    message.classList.add('error');
    return;

  }

  message.textContent=
    `Berhasil generate ${quantity} kartu.`;

  message.classList.add('success');

  await loadInventory();

});


/* ACTIVATE */

document.getElementById('activate')
.addEventListener('click',async()=>{

  const cardCode=
    document.getElementById('cardCode').value.trim();

  const businessName=
    document.getElementById('businessName').value.trim();

  const placeId=
    document.getElementById('placeId').value.trim();

  const pin=
    document.getElementById('pin').value.trim();

  const message=
    document.getElementById('activateMessage');

  message.textContent='';
  message.className='message';

  if(!cardCode ||
     !businessName ||
     !placeId ||
     !pin){

    message.textContent=
      'Semua field wajib diisi.';

    message.classList.add('error');
    return;

  }

  if(!/^[0-9]{4}$/.test(pin)){

    message.textContent=
      'PIN harus 4 digit.';

    message.classList.add('error');
    return;

  }

  const {error}=await supabase.rpc(
    'activate_card',
    {
      p_card_code:cardCode,
      p_business_name:businessName,
      p_place_id:placeId,
      p_pin:pin
    }
  );

  if(error){

    message.textContent=error.message;
    message.classList.add('error');
    return;

  }

  message.textContent=
    `${cardCode} berhasil diaktifkan.`;

  message.classList.add('success');

  document.getElementById('cardCode').value='';
  document.getElementById('businessName').value='';
  document.getElementById('placeId').value='';
  document.getElementById('pin').value='';

  await loadInventory();

});


/* LOGOUT */

document.getElementById('logout')
.addEventListener('click',async()=>{

  await supabase.auth.signOut();

  window.location.href='/admin/';

});


/* HTML ESCAPE */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* START */

(async()=>{

  const loggedIn=await checkAuth();

  if(loggedIn){

    await loadInventory();

  }

})();

</script>

</body>
</html>
