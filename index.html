<!DOCTYPE html>
<html lang="id"><!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XW8BYXLSNB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XW8BYXLSNB');
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KetemuTerus - Aktivasi Kartu NFC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(34, 197, 94, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .container.visible {
            opacity: 1;
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #22c55e 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #94a3b8;
            margin: 0;
        }

        form {
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(30, 41, 59, 1);
        }

        .form-group input::placeholder {
            color: rgba(148, 163, 184, 0.6);
        }

        .form-hint {
            font-size: 12px;
            color: #64748b;
            margin: 6px 0 0 0;
        }

        .form-hint a {
            color: #22c55e;
            text-decoration: none;
            font-weight: 500;
        }

        .form-hint a:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-message.show {
            display: flex;
        }

        .error-message span {
            color: #ef4444;
            font-size: 18px;
            flex-shrink: 0;
        }

        .error-message p {
            font-size: 13px;
            color: #fca5a5;
            margin: 0;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #22c55e 0%, #3b82f6 100%);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(34, 197, 94, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .submit-btn.success {
            background: rgba(34, 197, 94, 0.2);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-help {
            padding: 16px;
            background: rgba(34, 197, 94, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(34, 197, 94, 0.1);
            margin-bottom: 16px;
        }

        .footer-help p {
            font-size: 12px;
            color: #cbd5e1;
            margin: 0 0 6px 0;
            font-weight: 500;
        }

        .footer-help p:last-child {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
            line-height: 1.5;
        }

        .clear-btn {
            width: 100%;
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="header">
            <h1>Aktivasi Kartu</h1>
            <p>Isi formulir untuk mengaktifkan NFC card Anda</p>
        </div>

        <form id="nfcForm">
            <div class="form-group">
                <label for="businessName">Nama Bisnis</label>
                <input 
                    type="text" 
                    id="businessName" 
                    name="businessName" 
                    placeholder="Masukkan nama bisnis Anda"
                    required
                >
            </div>

            <div class="form-group">
                <label for="placeId">Google Place ID</label>
                <input 
                    type="text" 
                    id="placeId" 
                    name="placeId" 
                    placeholder="Contoh: ChIJN1blFLsB1tARG7h6AKJ1drI"
                    required
                >
                <p class="form-hint">Belum tau Place ID? <a href="https://developers-google-com.translate.goog/maps/documentation/places/web-service/place-id?_x_tr_sl=en&_x_tr_tl=id&_x_tr_hl=id&_x_tr_pto=tc" target="_blank" rel="noopener noreferrer">Cari di sini</a></p>
            </div>

            <div class="form-group">
                <label for="pin">Buat PIN (4 Digit Angka)</label>
                <input 
                    type="text" 
                    id="pin" 
                    name="pin" 
                    placeholder="1234"
                    maxlength="4"
                    inputmode="numeric"
                    required
                >
                <p class="form-hint">Digunakan untuk tracking & analytics</p>
            </div>

            <div id="errorMessage" class="error-message">
                <span>⚠️</span>
                <p id="errorText"></p>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span>Aktivkan Kartu</span>
                <span>→</span>
            </button>
        </form>

        <div class="footer-help">
            <p>💡 Belum punya Place ID?</p>
            <p>Cari nama bisnis Anda di Google Maps, copy ID dari URL atau hubungi admin.</p>
        </div>

        <button id="clearBtn" class="clear-btn">🔄 Clear Saved Data</button>
    </div>

    <script>
        const form = document.getElementById('nfcForm');
        const container = document.getElementById('mainContainer');
        const businessNameInput = document.getElementById('businessName');
        const placeIdInput = document.getElementById('placeId');
        const pinInput = document.getElementById('pin');
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Check URL parameter for clear
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('clear') === 'true') {
    localStorage.removeItem('nfcActivationData');
    window.history.replaceState({}, document.title, window.location.pathname);
}

// Check localStorage on page load
window.addEventListener('load', () => {
    const savedData = localStorage.getItem('nfcActivationData');
    if (savedData) {
        try {
            const data = JSON.parse(savedData);
            console.log('Found saved activation data, redirecting...');
            window.location.href = data.googleReviewUrl;
        } catch (err) {
            console.log('Error parsing saved data');
            container.classList.add('visible');
        }
    } else {
        container.classList.add('visible');
    }
});

        // PIN validation - only numbers
        pinInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        });

        // Form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMessage.classList.remove('show');
            errorText.textContent = '';

            if (!businessNameInput.value.trim()) {
                showError('Nama bisnis harus diisi');
                return;
            }
            if (!placeIdInput.value.trim()) {
                showError('Google Place ID harus diisi');
                return;
            }
            if (pinInput.value.length !== 4) {
                showError('PIN harus 4 digit');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<div class="spinner"></div><span>Memproses...</span>';

            try {
                const businessName = businessNameInput.value;
                const placeId = placeIdInput.value;
                const pin = pinInput.value;

                const trackingParams = new URLSearchParams({
                    utm_source: 'nfc',
                    utm_medium: 'card',
                    utm_campaign: pin,
                    utm_content: businessName.toLowerCase().replace(/\s+/g, '-'),
                });

                const googleReviewUrl = `https://search.google.com/local/writereview?placeid=${placeId}&${trackingParams.toString()}`;

                console.log('NFC Review Activation:', {
                    timestamp: new Date().toISOString(),
                    businessName: businessName,
                    placeId: placeId,
                    cardId: pin,
                    redirectUrl: googleReviewUrl,
                });

                // Send tracking to Google Sheets
                fetch('https://script.google.com/macros/s/AKfycby6jiT6s5OdrFuh2ZW_aDUGGxswPK2pvFqlnqmQaLtumCDN3gpy49GTR6yiDmY565GmEQ/exec', {
                    method: 'POST',
                    body: JSON.stringify({
                        businessName: businessName,
                        placeId: placeId,
                        pin: pin
                    })
                }).catch(err => console.log('Tracking sent'));

                submitBtn.classList.remove('loading');
                submitBtn.classList.add('success');
                submitBtn.innerHTML = '<span>✓</span><span>Berhasil! Mengalihkan...</span>';

                // Save to localStorage
                localStorage.setItem Track GA event
gtag('event', 'nfc_activation', {
    'business_name': businessName,
    'place_id': placeId,
    'pin': pin
});('nfcActivationData', JSON.stringify({
                    businessName: businessName,
                    placeId: placeId,
                    pin: pin,
                    googleReviewUrl: googleReviewUrl,
                    timestamp: new Date().toISOString()
                }));

                setTimeout(() => {
                    window.location.href = googleReviewUrl;
                }, 1500);

            } catch (err) {
                showError('Terjadi kesalahan. Silakan coba lagi.');
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<span>Aktivkan Kartu</span><span>→</span>';
            }
        });

        // Clear button
        clearBtn.addEventListener('click', () => {
            if (confirm('Hapus data yang disimpan? Anda perlu isi form lagi di scan berikutnya.')) {
                localStorage.removeItem('nfcActivationData');
                alert('Data cleared. Form siap untuk aktivasi baru.');
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
