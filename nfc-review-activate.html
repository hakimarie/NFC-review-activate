<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KetemuTerus - Aktivasi Kartu NFC</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.6);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function NFCReviewActivation() {
            const [formData, setFormData] = useState({
                businessName: '',
                placeId: '',
                pin: '',
            });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState(false);

            const handleChange = (e) => {
                const { name, value } = e.target;
                if (name === 'pin') {
                    const sanitized = value.replace(/\D/g, '').slice(0, 4);
                    setFormData(prev => ({ ...prev, [name]: sanitized }));
                } else {
                    setFormData(prev => ({ ...prev, [name]: value }));
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess(false);

                if (!formData.businessName.trim()) {
                    setError('Nama bisnis harus diisi');
                    return;
                }
                if (!formData.placeId.trim()) {
                    setError('Google Place ID harus diisi');
                    return;
                }
                if (formData.pin.length !== 4) {
                    setError('PIN harus 4 digit');
                    return;
                }

                setLoading(true);

                try {
                    const trackingParams = new URLSearchParams({
                        utm_source: 'nfc',
                        utm_medium: 'card',
                        utm_campaign: formData.pin,
                        utm_content: formData.businessName.toLowerCase().replace(/\s+/g, '-'),
                    });

                    const googleReviewUrl = `https://search.google.com/local/reviews?placeid=${formData.placeId}&${trackingParams.toString()}`;

                    console.log('NFC Review Activation:', {
                        timestamp: new Date().toISOString(),
                        businessName: formData.businessName,
                        placeId: formData.placeId,
                        cardId: formData.pin,
                        redirectUrl: googleReviewUrl,
                    });

                    setTimeout(() => {
                        setSuccess(true);
                        setTimeout(() => {
                            window.location.href = googleReviewUrl;
                        }, 1500);
                    }, 300);
                } catch (err) {
                    setError('Terjadi kesalahan. Silakan coba lagi.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div
                    style={{
                        background: 'linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%)',
                        minHeight: '100vh',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '20px',
                    }}
                >
                    <div
                        style={{
                            background: 'rgba(15, 23, 42, 0.95)',
                            backdropFilter: 'blur(10px)',
                            borderRadius: '20px',
                            padding: '32px',
                            maxWidth: '480px',
                            width: '100%',
                            border: '1px solid rgba(34, 197, 94, 0.1)',
                            boxShadow: '0 20px 60px rgba(0, 0, 0, 0.4)',
                        }}
                    >
                        {/* Header */}
                        <div style={{ marginBottom: '32px', textAlign: 'center' }}>
                            <h1
                                style={{
                                    fontSize: '28px',
                                    fontWeight: '700',
                                    color: '#ffffff',
                                    margin: '0 0 8px 0',
                                    background: 'linear-gradient(135deg, #22c55e 0%, #3b82f6 100%)',
                                    WebkitBackgroundClip: 'text',
                                    WebkitTextFillColor: 'transparent',
                                }}
                            >
                                Aktivasi Kartu
                            </h1>
                            <p
                                style={{
                                    fontSize: '14px',
                                    color: '#94a3b8',
                                    margin: '0',
                                }}
                            >
                                Isi formulir untuk mengaktifkan NFC card Anda
                            </p>
                        </div>

                        {/* Form */}
                        <form onSubmit={handleSubmit} style={{ marginBottom: '24px' }}>
                            {/* Business Name */}
                            <div style={{ marginBottom: '24px' }}>
                                <label
                                    style={{
                                        display: 'block',
                                        fontSize: '14px',
                                        fontWeight: '500',
                                        color: '#e2e8f0',
                                        marginBottom: '8px',
                                    }}
                                >
                                    Nama Bisnis
                                </label>
                                <input
                                    type="text"
                                    name="businessName"
                                    value={formData.businessName}
                                    onChange={handleChange}
                                    placeholder="Masukkan nama bisnis Anda"
                                    style={{
                                        width: '100%',
                                        padding: '12px 16px',
                                        fontSize: '14px',
                                        border: '1px solid rgba(51, 65, 85, 0.6)',
                                        borderRadius: '10px',
                                        background: 'rgba(30, 41, 59, 0.8)',
                                        color: '#e2e8f0',
                                        outline: 'none',
                                        transition: 'all 0.2s ease',
                                    }}
                                    onFocus={(e) => {
                                        e.target.style.borderColor = 'rgba(34, 197, 94, 0.5)';
                                        e.target.style.background = 'rgba(30, 41, 59, 1)';
                                    }}
                                    onBlur={(e) => {
                                        e.target.style.borderColor = 'rgba(51, 65, 85, 0.6)';
                                        e.target.style.background = 'rgba(30, 41, 59, 0.8)';
                                    }}
                                />
                            </div>

                            {/* Google Place ID */}
                            <div style={{ marginBottom: '24px' }}>
                                <label
                                    style={{
                                        display: 'block',
                                        fontSize: '14px',
                                        fontWeight: '500',
                                        color: '#e2e8f0',
                                        marginBottom: '8px',
                                    }}
                                >
                                    Google Place ID
                                </label>
                                <input
                                    type="text"
                                    name="placeId"
                                    value={formData.placeId}
                                    onChange={handleChange}
                                    placeholder="Contoh: ChIJN1blFLsB1tARG7h6AKJ1drI"
                                    style={{
                                        width: '100%',
                                        padding: '12px 16px',
                                        fontSize: '14px',
                                        border: '1px solid rgba(51, 65, 85, 0.6)',
                                        borderRadius: '10px',
                                        background: 'rgba(30, 41, 59, 0.8)',
                                        color: '#e2e8f0',
                                        outline: 'none',
                                        transition: 'all 0.2s ease',
                                        fontFamily: 'monospace',
                                    }}
                                    onFocus={(e) => {
                                        e.target.style.borderColor = 'rgba(34, 197, 94, 0.5)';
                                        e.target.style.background = 'rgba(30, 41, 59, 1)';
                                    }}
                                    onBlur={(e) => {
                                        e.target.style.borderColor = 'rgba(51, 65, 85, 0.6)';
                                        e.target.style.background = 'rgba(30, 41, 59, 0.8)';
                                    }}
                                />
                            </div>

                            {/* PIN */}
                            <div style={{ marginBottom: '28px' }}>
                                <label
                                    style={{
                                        display: 'block',
                                        fontSize: '14px',
                                        fontWeight: '500',
                                        color: '#e2e8f0',
                                        marginBottom: '8px',
                                    }}
                                >
                                    Buat PIN (4 Digit Angka)
                                </label>
                                <input
                                    type="text"
                                    name="pin"
                                    value={formData.pin}
                                    onChange={handleChange}
                                    placeholder="1234"
                                    maxLength="4"
                                    inputMode="numeric"
                                    style={{
                                        width: '100%',
                                        padding: '12px 16px',
                                        fontSize: '14px',
                                        border: '1px solid rgba(51, 65, 85, 0.6)',
                                        borderRadius: '10px',
                                        background: 'rgba(30, 41, 59, 0.8)',
                                        color: '#e2e8f0',
                                        outline: 'none',
                                        transition: 'all 0.2s ease',
                                        letterSpacing: '4px',
                                        textAlign: 'center',
                                    }}
                                    onFocus={(e) => {
                                        e.target.style.borderColor = 'rgba(34, 197, 94, 0.5)';
                                        e.target.style.background = 'rgba(30, 41, 59, 1)';
                                    }}
                                    onBlur={(e) => {
                                        e.target.style.borderColor = 'rgba(51, 65, 85, 0.6)';
                                        e.target.style.background = 'rgba(30, 41, 59, 0.8)';
                                    }}
                                />
                                <p
                                    style={{
                                        fontSize: '12px',
                                        color: '#64748b',
                                        margin: '6px 0 0 0',
                                    }}
                                >
                                    Digunakan untuk tracking & analytics
                                </p>
                            </div>

                            {/* Error Message */}
                            {error && (
                                <div
                                    style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '10px',
                                        padding: '12px 14px',
                                        background: 'rgba(239, 68, 68, 0.1)',
                                        border: '1px solid rgba(239, 68, 68, 0.3)',
                                        borderRadius: '8px',
                                        marginBottom: '20px',
                                    }}
                                >
                                    <span style={{ color: '#ef4444', fontSize: '18px' }}>⚠️</span>
                                    <p
                                        style={{
                                            fontSize: '13px',
                                            color: '#fca5a5',
                                            margin: '0',
                                        }}
                                    >
                                        {error}
                                    </p>
                                </div>
                            )}

                            {/* Submit Button */}
                            <button
                                type="submit"
                                disabled={loading || success}
                                style={{
                                    width: '100%',
                                    padding: '14px 20px',
                                    fontSize: '16px',
                                    fontWeight: '600',
                                    border: 'none',
                                    borderRadius: '12px',
                                    background: success
                                        ? 'rgba(34, 197, 94, 0.2)'
                                        : 'linear-gradient(135deg, #22c55e 0%, #3b82f6 100%)',
                                    color: '#ffffff',
                                    cursor: loading || success ? 'not-allowed' : 'pointer',
                                    opacity: loading || success ? 0.8 : 1,
                                    transition: 'all 0.3s ease',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    gap: '8px',
                                }}
                            >
                                {success ? (
                                    <>
                                        <span style={{ fontSize: '20px' }}>✓</span>
                                        <span>Berhasil! Mengalihkan...</span>
                                    </>
                                ) : loading ? (
                                    <>
                                        <div
                                            style={{
                                                width: '18px',
                                                height: '18px',
                                                border: '2px solid rgba(255, 255, 255, 0.3)',
                                                borderTop: '2px solid white',
                                                borderRadius: '50%',
                                                animation: 'spin 0.8s linear infinite',
                                            }}
                                        />
                                        <span>Memproses...</span>
                                    </>
                                ) : (
                                    <>
                                        <span>Aktivkan Kartu</span>
                                        <span>→</span>
                                    </>
                                )}
                            </button>
                        </form>

                        {/* Footer Help */}
                        <div
                            style={{
                                padding: '16px',
                                background: 'rgba(34, 197, 94, 0.05)',
                                borderRadius: '8px',
                                border: '1px solid rgba(34, 197, 94, 0.1)',
                            }}
                        >
                            <p
                                style={{
                                    fontSize: '12px',
                                    color: '#cbd5e1',
                                    margin: '0 0 6px 0',
                                    fontWeight: '500',
                                }}
                            >
                                💡 Belum punya Place ID?
                            </p>
                            <p
                                style={{
                                    fontSize: '12px',
                                    color: '#94a3b8',
                                    margin: '0',
                                    lineHeight: '1.5',
                                }}
                            >
                                Cari nama bisnis Anda di Google Maps, copy ID dari URL atau hubungi admin.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NFCReviewActivation />);
    </script>
</body>
</html>
